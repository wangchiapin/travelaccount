<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>旅費帳本</title>
<style>
  :root{
    --cream:#F7F4EE;
    --paper:#FFFFFF;
    --ink:#4A4238;
    --ink-soft:#7A6F60;
    --muted:#A69C8C;
    --border:#E3DDD0;
    --brick:#B08968;
    --brick-dark:#8C6B4F;
    --brick-tint:#EFE6D8;
    --jade:#8A9A7E;
    --jade-dark:#64735A;
    --jade-tint:#E8ECE2;
    --gold:#C9A227;
    --gold-tint:#F1E8CE;
    --danger:#B5544A;
    --radius:10px;
    --shadow:0 1px 4px rgba(74,66,56,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);padding-bottom:88px;position:relative;}
  input,select,textarea,button{font-family:inherit;font-size:15px;}
  input,select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--paper);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jade);}
  button{cursor:pointer;}
  .hidden{display:none !important;}

  /* header */
  .topbar{
    display:flex;align-items:center;gap:10px;padding:16px 18px 14px;
    background:var(--paper);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .stamp{
    width:34px;height:34px;border-radius:8px;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;
    flex-shrink:0;background:var(--ink);
  }
  .topbar-title{flex:1;min-width:0;}
  .topbar-title h1{font-size:17px;font-weight:500;margin:0;}
  .topbar-title p{font-size:12px;color:var(--muted);margin:2px 0 0;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
    background:var(--paper);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);flex-shrink:0;
  }
  .icon-btn:active{background:var(--cream);}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:4px 4px 4px 0;display:flex;align-items:center;gap:2px;}

  /* buttons */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    height:44px;border-radius:8px;border:1px solid var(--border);
    background:var(--paper);color:var(--ink);font-size:15px;font-weight:500;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-danger{color:var(--danger);border-color:var(--danger);background:var(--paper);}
  .btn-block{width:100%;}
  .btn-sm{height:34px;font-size:13px;padding:0 12px;border-radius:8px;}

  /* screens */
  .screen{padding:16px 18px 24px;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty p{font-size:14px;line-height:1.6;}

  /* trip cards */
  .trip-card{
    background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .trip-card h3{margin:0 0 4px;font-size:16px;font-weight:500;}
  .trip-card .dates{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .trip-card .total{font-size:20px;font-weight:500;}
  .trip-card .total .unit{font-size:12px;color:var(--muted);font-weight:400;margin-right:2px;}

  /* tabs */
  .tabbar{
    display:flex;gap:4px;background:var(--paper);border:1px solid var(--border);
    border-radius:16px;padding:4px;margin-bottom:16px;overflow-x:auto;
  }
  .tabbar button{
    flex:1 0 auto;background:none;border:none;height:36px;border-radius:13px;font-size:11.5px;
    color:var(--ink-soft);white-space:nowrap;padding:0 6px;
  }
  .tabbar button.active{background:var(--jade);color:#fff;font-weight:500;}

  /* day group / ledger */
  .day-group{margin-bottom:18px;}
  .day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 10px;background:var(--border);border-radius:8px;margin-bottom:6px;
  }
  .day-head .d{font-size:13px;font-weight:500;color:var(--ink-soft);}
  .day-head .t{font-size:12px;color:var(--muted);}
  .entry{
    display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .entry:last-child{border-bottom:none;}
  .cat-dot{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:500;flex-shrink:0;
  }
  .entry-main{flex:1;min-width:0;}
  .entry-main .name{font-size:14px;}
  .entry-main .meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .entry-side{text-align:right;flex-shrink:0;}
  .entry-side .amt{font-size:14px;font-weight:500;}
  .badge{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:3px;
  }

  /* fab */
  .fab{
    position:sticky;bottom:16px;margin:20px auto 0;width:calc(100% - 0px);
  }

  /* settlement */
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .metric-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .metric-card .lbl{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .metric-card .val{font-size:20px;font-weight:500;}
  .person-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;
  }
  .person-row .name{font-size:15px;font-weight:500;}
  .person-row .paid{font-size:12px;color:var(--muted);margin-top:2px;}
  .settle-badge{font-size:13px;padding:5px 12px;border-radius:20px;font-weight:500;}
  .settle-plus{background:var(--jade-tint);color:var(--jade-dark);}
  .settle-minus{background:var(--brick-tint);color:var(--brick-dark);}
  .settle-even{background:var(--border);color:var(--ink-soft);}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,38,32,0.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-sheet{
    width:100%;max-width:480px;background:var(--cream);border-radius:18px 18px 0 0;
    max-height:92vh;overflow-y:auto;padding:18px 18px 24px;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h2{font-size:17px;font-weight:500;margin:0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:13px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--paper);color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .amount-row{display:flex;gap:8px;}
  .amount-row select{width:92px;flex-shrink:0;}
  .amount-row input{flex:1;text-align:right;}
  .convert-hint{font-size:12px;color:var(--muted);text-align:right;margin-top:6px;}
  .payer-row{display:flex;gap:8px;flex-wrap:wrap;}
  .payer-row button{flex:1;min-width:80px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--paper);font-size:14px;}
  .payer-row button.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
  .switch{width:40px;height:24px;border-radius:20px;background:var(--border);position:relative;border:none;padding:0;flex-shrink:0;}
  .switch.on{background:var(--jade);}
  .switch .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .15s;}
  .switch.on .knob{left:18px;}

  /* settings list */
  .list-row{
    display:flex;align-items:center;justify-content:space-between;padding:12px 2px;
    border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}
  .section-title{font-size:13px;color:var(--ink-soft);font-weight:500;margin:20px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .row-inline{display:flex;gap:8px;align-items:center;}
  .small-input{width:70px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;
    z-index:100;box-shadow:var(--shadow);
  }

  /* filter panel */
  .filter-panel{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .filter-row{margin-bottom:10px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-row label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .filter-range{display:flex;gap:8px;align-items:center;}
  .filter-range input{flex:1;}
  .subtotal-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--jade-tint);color:var(--jade-dark);border-radius:var(--radius);
    padding:10px 14px;margin-bottom:14px;font-size:13px;
  }
  .subtotal-bar .n{font-size:16px;font-weight:500;}
  .split-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .split-row span{width:52px;flex-shrink:0;font-size:13px;}
  .split-row input{flex:1;text-align:right;}
  .exchange-card{
    background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;
  }
  .exchange-card .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px;}
  .exchange-card .sub{font-size:12px;color:var(--muted);}
  .ledger-scroll{overflow-y:auto;}
  .subtotal-bar.always{background:var(--paper);color:var(--ink);border:1px solid var(--border);}
  .ledger-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .ledger-total{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;}
  .ledger-total-label{font-size:11px;color:var(--muted);}
  .ledger-total-amount{font-size:15px;font-weight:600;color:var(--ink);}
  .fx-input{width:110px;text-align:right;}

  .entry.quick-pending{background:var(--brick-tint);border-radius:12px;margin:0 -6px;padding:10px 6px;}

  .qn-candidate{
    display:flex;align-items:flex-start;gap:10px;background:var(--paper);
    border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;
  }
  .qn-candidate input[type="checkbox"]{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--brick);}
  .qn-candidate .qn-main{flex:1;min-width:0;}
  .qn-candidate .qn-name{font-size:14px;}
  .qn-candidate .qn-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .qn-candidate .qn-amt{font-size:14px;font-weight:500;white-space:nowrap;}
  .qn-fail{
    background:var(--gold-tint);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;
  }
  .qn-fail .raw{font-size:13px;font-family:monospace;background:var(--paper);padding:6px 8px;border-radius:8px;margin-top:6px;white-space:pre-wrap;}

  .cheer-popup{
    position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.9);
    background:var(--paper);border:2px solid var(--brick-tint);color:var(--ink);
    padding:16px 26px;border-radius:24px;font-size:16px;font-weight:500;
    box-shadow:0 8px 24px rgba(230,120,160,0.25);z-index:120;text-align:center;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
  }
  .cheer-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="screen-login" class="screen hidden">
    <div style="text-align:center;padding:60px 0 30px;">
      <div class="stamp" style="width:52px;height:52px;font-size:18px;margin:0 auto 14px;">帳</div>
      <h1 style="font-size:19px;font-weight:500;margin:0;">旅費帳本</h1>
      <p style="font-size:13px;color:var(--muted);margin:6px 0 0;">一起記，一起算</p>
    </div>
    <div class="field"><label>email</label><input id="login-email" type="email" placeholder="name@example.com"></div>
    <div class="field"><label>密碼</label><input id="login-pass" type="password" placeholder="至少 6 碼"></div>
    <button class="btn btn-primary btn-block" id="btn-login" style="margin-bottom:10px;">登入</button>
    <button class="btn btn-block" id="btn-register">建立新帳號</button>
    <p id="login-error" style="color:var(--danger);font-size:13px;text-align:center;margin-top:14px;"></p>
  </div>

  <!-- HOUSEHOLD SETUP -->
  <div id="screen-household" class="screen hidden">
    <div style="text-align:center;padding:40px 0 24px;">
      <div class="stamp" style="width:52px;height:52px;font-size:18px;margin:0 auto 14px;">家</div>
      <h1 style="font-size:19px;font-weight:500;margin:0;">建立或加入家庭帳本</h1>
      <p style="font-size:13px;color:var(--muted);margin:6px 0 0;">兩人要用同一套帳本，其中一人先建立，再把邀請碼給另一人加入</p>
    </div>
    <div class="field"><label>家庭帳本名稱</label><input id="hh-name" placeholder="例如：我們家"></div>
    <button class="btn btn-primary btn-block" id="btn-create-household" style="margin-bottom:18px;">建立新的家庭帳本</button>
    <div class="section-title" style="text-align:center;">— 或 —</div>
    <div class="field"><label>邀請碼</label><input id="hh-code" placeholder="貼上另一半給你的邀請碼"></div>
    <button class="btn btn-block" id="btn-join-household">加入家庭帳本</button>
    <p id="household-error" style="color:var(--danger);font-size:13px;text-align:center;margin-top:14px;"></p>
    <button class="back-btn" id="btn-household-logout" style="margin-top:24px;">登出</button>
  </div>

  <!-- TRIP LIST -->
  <div id="screen-trips" class="screen hidden" style="padding-top:0;">
    <div class="topbar" style="margin:0 -18px 18px;">
      <div class="stamp">帳</div>
      <div class="topbar-title"><h1 id="household-title">旅費帳本</h1></div>
      <button class="icon-btn" id="btn-invite" title="邀請碼">👥</button>
      <button class="icon-btn" id="btn-logout" title="登出">⏻</button>
    </div>
    <div id="trips-list"></div>
    <button class="btn btn-primary btn-block" id="btn-new-trip">＋ 新增旅行</button>
  </div>

  <!-- TRIP DETAIL -->
  <div id="screen-trip" class="screen hidden" style="padding-top:0;">
    <div class="topbar" style="margin:0 -18px 18px;">
      <button class="back-btn" id="btn-back-trips">‹ 旅行</button>
      <div class="topbar-title" style="text-align:center;">
        <h1 id="trip-title" style="font-size:15px;"></h1>
      </div>
      <div style="width:36px;"></div>
    </div>
    <div class="tabbar">
      <button data-tab="ledger" class="active">帳本</button>
      <button data-tab="quicknote">隨手記</button>
      <button data-tab="settle">結算</button>
      <button data-tab="exchange">換匯</button>
      <button data-tab="settings">設定</button>
    </div>
    <div id="tab-ledger"></div>
    <div id="tab-settle" class="hidden"></div>
    <div id="tab-exchange" class="hidden"></div>
    <div id="tab-quicknote" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
    <button class="btn btn-primary fab" id="btn-add-expense">＋ 新增一筆</button>
  </div>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="cheer-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
